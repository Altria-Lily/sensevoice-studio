[project]
name = "sensevoice-studio"
version = "0.1.0"
description = "Local video transcription with FunASR, SenseVoice, timestamps and speaker diarization"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

